# ==============================================================================
# ALERT THRESHOLDS, HEALTH INDEX PARAMETERS AND DETECTOR TUNING
# Single source of truth — PRD Part 0 §0.11: "Every threshold/constant lives in
# configs/*.yaml — none hard-coded."
#
# Traceability:
#   parameters.*      -> PRD Part 1 §3.1 (sensor spec, alert/critical limits)
#   health.*          -> PRD Part 2 §9.2 / §9.3 (health indices, CHI weights)
#   alert_levels.*    -> PRD Part 2 §9.5 (5 levels)  +  PRD Part 4 §4 (411F map)
#   faults.*          -> PRD Part 2 §10.1 - §10.8 (all 8 required faults)
#   detectors.*       -> PRD Part 2 §11 (three-tier anomaly detection)
#   rul.*             -> PRD Part 2 §12
#   advisory.*        -> PRD Part 2 §13.2 / §16.3
# ==============================================================================
schema_version: 1

# ------------------------------------------------------------------------------
# 1. PER-PARAMETER LIMITS
#
# SOURCE OF TRUTH: the CERTIFIED operating limits of the reference engine
# (Rotax 915 iS / iSc A), not the PRD.
#   [TCDS] EASA Type Certificate Data Sheet E.121 Issue 17, 18 December 2023
#   [OM]   BRP-Rotax Operators Manual OM-915 i A, Ed. 0 Rev. 1, 01 June 2019, s2.1
#   [MOD]  modelled / operational band, not a certified limit
#
# PRD Part 1 s3.1 gave CHT 140-200 normal / 230 critical and EGT 550-700 normal
# / 850 critical. Those are AIR-COOLED Lycoming/Continental bands. The 915 iS
# has LIQUID-COOLED heads with a certified 120 degC coolant limit and a
# certified 950 degC EGT limit. Using the PRD bands would raise a false EGT
# warning on every flight and miss a real coolant overheat.
# See docs/PRD_DEVIATIONS.md DEV-13.
#
#    normal_[min|max]   : within this band => no alert
#    alert_*            : Level 3 CAUTION
#    critical_*         : Level 5 WARNING
#    hysteresis         : value must return this far inside the limit to clear
#                         (PRD Part 2 s11.1 Tier-1 "Rule hysteresis")
# ------------------------------------------------------------------------------
parameters:

  rpm:
    unit: "rpm"
    range: [0, 6500]
    resolution: 1
    idle_min: 1800           # [OM] minimum idle speed
    normal_min: 1800
    normal_max: 5500         # [TCDS] max continuous
    alert_max: 5500          # sustained above max-continuous is a caution
    alert_min: 1500
    critical_max: 5800       # [TCDS] take-off rpm, 5-minute limit
    critical_min: 800
    takeoff_max_rpm: 5800    # [TCDS]
    takeoff_time_limit_s: 300  # [TCDS] 5 minutes
    hysteresis: 100
    # Plausibility (PRD Part 1 s8.3 Method 2): a change faster than the engine
    # can physically make. The bound is the free acceleration of the rotating
    # system at maximum torque, max_torque_Nm / rotating_inertia_at_crank_kg_m2
    # = 171.9 N m / 0.16 kg m2 = 1074 rad/s2 = 10,260 rpm/s [DER]
    # (configs/engines/rotax_915is.yaml). It was 2,000 rpm/s with no source.
    # A healthy lever advance through the constant-speed governor measured up to
    # 4,050 rpm/s, so the ingest deleted engine speed during take-off and raised
    # SENSOR FAULT on a healthy engine (audit 15 Sep, P0). A rate check can only
    # reject what physics forbids: a faulty sensor that stays inside this bound
    # is not caught by it.
    max_rate_per_s: 10260    # [DER] see above

  cht:
    # ADDED HUMS INSTRUMENTATION. The 915 i fits no per-cylinder CHT sensors and
    # PUBLISHES NO CHT LIMIT: its heads are liquid-cooled, and the thermal limit
    # the manufacturer gives is coolant temperature (120 degC) plus a 200 degC
    # cylinder WALL limit on the air-cooled barrel [IM 75-00-00], which is a
    # different location from these probes. The problem statement requires CHT
    # monitoring, so this project fits the sensors and sets its own bands.
    unit: "degC"
    range: [0, 200]
    resolution: 0.1
    normal_min: 80
    normal_max: 120
    # 130, not 125: at take-off power with reduced ram cooling the engine
    # genuinely reaches ~131 degC, so an alert at 125 fires on every take-off
    # and trains the operator to ignore it (MIL-STD-411F 4.1.1a). 130 still
    # leaves 5 degC of margin to the certified limit.
    # 132: at take-off power with low ram airspeed the engine genuinely reaches
    # ~131 degC. That it runs within ~4 degC of its certified limit under those
    # conditions is a real operational finding, reported in the mission summary
    # rather than as a caution on every departure.
    alert_max: 132
    # [MOD] NOT a limit Rotax publishes for the 915 i, which has none: its
    # heads are liquid-cooled and the manufacturer's thermal limit is COOLANT
    # temperature, 120 degC. This came from the air-cooled 912 S family and was
    # labelled as though it were this engine's (found 17 Sep in the manuals).
    # Kept as this project's alert level for its own added head probes.
    critical_max: 135        # [MOD] see above
    spread_alert: 15         # [MOD] liquid-cooled heads run far more even
    spread_critical: 25      # [MOD]
    hysteresis: 5
    max_rate_per_s: 50       # PRD Part 1 s8.3 plausibility
    plausible_range: [-40, 300]

  coolant_temperature:
    # THE CERTIFIED THERMAL LIMIT for this engine. One sensor, on cylinder
    # head 4 [OM s7.2].
    unit: "degC"
    range: [-40, 150]
    resolution: 0.1
    normal_min: 75
    normal_max: 110
    alert_max: 115
    critical_max: 120        # [TCDS/OM] CERTIFIED LIMIT
    # warmup_max: 90 deleted (review PHY-14). OM Rev.4 page 2-5 gives only a
    # -20 degC minimum; the 90 degC warm-up limit was removed from the manual
    # and nothing in the code read it.
    hysteresis: 4
    max_rate_per_s: 20
    plausible_range: [-40, 200]

  egt:
    unit: "degC"
    range: [0, 1100]
    resolution: 0.5
    normal_min: 700          # [MOD] turbocharged spark engine cruise band
    normal_max: 900          # [MOD]
    alert_max: 920           # [MOD] approaching the certified limit
    critical_max: 950        # [OM] CERTIFIED LIMIT
    spread_alert: 150        # [MOD] below the certified split limit
    spread_critical: 200     # [OM] CERTIFIED EGT-split limit above 3 L/hr
    spread_critical_low_flow: 500   # [OM] below 3 L/hr fuel flow
    spread_low_flow_threshold_lph: 3.0  # [OM]
    hysteresis: 25
    max_rate_per_s: 250
    plausible_range: [-40, 1300]

  oil_pressure:
    # [OM s2.1] >3500 rpm: 2.0-5.0 bar (29-72.5 psi).
    #           <3500 rpm: min 0.8 bar (11.6 psi), same 5 bar maximum.
    #           7 bar (101.5 psi) allowed only briefly at cold start.
    unit: "psi"
    range: [0, 120]
    resolution: 0.1
    normal_min: 29.0         # [OM] 2.0 bar
    normal_max: 72.5         # [OM] 5.0 bar
    alert_min: 29.0
    alert_max: 72.5
    critical_min: 11.6       # [OM] 0.8 bar, and only legal below 3500 rpm
    critical_max: 101.5      # [OM] 7 bar
    # The speed the minimum changes at, DECLARED rather than defaulted.
    #
    # edge_rules.OILP_AT_SPEED already looked for these two keys and fell back
    # to 3500/29.0 when they were absent, so the rule was right; but the
    # console's tile and the twin's own margin both took alert_min at EVERY
    # speed. At 3285 rpm and 22.9 psi -- legal, the minimum there is 0.8 bar --
    # the display showed OIL PRESS in red tagged BELOW LIMIT beside an alert
    # panel correctly reading "every parameter is inside its limit".
    low_speed_rpm: 3500.0      # [OM s2.1]
    high_speed_min_psi: 29.0   # [OM s2.1] 2.0 bar
    low_speed_min_psi: 11.6  # [OM] applies below low_speed_rpm
    high_speed_min_psi: 29.0 # [OM] applies above low_speed_rpm
    low_speed_rpm: 3500      # [OM]
    hysteresis: 2
    max_rate_per_s: 20       # PRD Part 1 s8.3
    plausible_range: [-5, 130]

  oil_temperature:
    # [OM s2.1] normal operation 50-130 degC; 90-110 degC recommended, and
    # below 90 degC risks condensation in the lubrication system.
    unit: "degC"
    range: [-40, 160]
    resolution: 0.1
    normal_min: 90           # [OM] recommended band
    normal_max: 110          # [OM] recommended band
    alert_min: 50            # [OM] minimum for take-off
    alert_max: 120
    critical_min: -20        # [OM] minimum for engine start
    critical_max: 130        # [TCDS/OM] CERTIFIED LIMIT
    takeoff_min: 50          # [OM]
    hysteresis: 4
    max_rate_per_s: 5
    plausible_range: [-45, 200]

  fuel_flow:
    # [OM performance table] full-throttle fuel flow is 24-34 kg/h, up to
    # 47.5 L/hr at 0.72 kg/L (5800 rpm), and 32.2 kg/h = 44.7 L/hr at 5500 rpm
    # at sea level. The band this replaced came from a 280-310 g/kWh figure
    # quoted from a data sheet not in this repository, and put every take-off
    # above its 46 L/hr caution once fuel flow matched the table (DEV-229).
    # The caution and warning margins above the table maximum are [MOD].
    unit: "L/hr"
    range: [0, 60]
    resolution: 0.01
    normal_min: 8
    normal_max: 48
    alert_min: 6
    alert_max: 52
    critical_min: 3
    critical_max: 56
    hysteresis: 1.0
    # An electronically injected engine can double its fuel flow in well under
    # a second, and this engine spans 8-42 L/hr. The 20 L/hr/s inherited from
    # the smaller 914 rejected legitimate throttle slams as implausible.
    max_rate_per_s: 40
    plausible_range: [-0.5, 70]

  manifold_pressure:
    # [OM s2.1] 60 hPa to 1730 hPa absolute.
    unit: "bar"
    range: [0, 2.0]
    resolution: 0.001
    normal_min: 0.30
    normal_max: 1.73
    alert_max: 1.75
    critical_min: 0.06       # [OM] 60 hPa
    critical_max: 1.80       # over-boost
    hysteresis: 0.02
    max_rate_per_s: 2.0
    plausible_range: [0, 3.0]

  manifold_air_temperature:
    # [OM s2.1] MAT limit 50 degC; the critical-altitude rating is quoted at
    # MAT max 50 degC, and observed power falls when MAT exceeds it.
    unit: "degC"
    range: [-40, 120]
    resolution: 0.1
    # [OM performance table] plenum air is printed down to -39.5 degC (22,999 ft,
    # ISA-15) in normal operation, and sits 4-6 K above ambient everywhere. The
    # -20 degC this used to say was below what the manufacturer's own table
    # shows at the 23,000 ft ceiling on a standard day (-24.8 degC).
    normal_min: -40
    normal_max: 45
    alert_max: 50            # [OM] CERTIFIED LIMIT
    critical_max: 60
    hysteresis: 3
    max_rate_per_s: 20
    plausible_range: [-50, 150]

  fuel_pressure:
    # [OM s2.1] rail pressure 2.9-3.1 bar; 2.5-3.5 bar tolerated for max 3 s
    # after a power-setting change.
    unit: "bar"
    range: [0, 6]
    resolution: 0.01
    normal_min: 2.9
    normal_max: 3.1
    alert_min: 2.5
    alert_max: 3.5
    critical_min: 2.0
    critical_max: 4.0
    transient_allowance_s: 3.0   # [OM]
    hysteresis: 0.1
    max_rate_per_s: 3
    plausible_range: [0, 8]

  vibration_rms:
    # [MOD] Not a manufacturer-published parameter. Bands follow ISO 10816
    # class practice for reciprocating machinery, scaled to this engine.
    unit: "m/s2"
    range: [0, 50]
    resolution: 0.01
    normal_max: 3.5
    alert_max: 5.0
    critical_max: 8.0
    hysteresis: 0.4
    max_rate_per_s: 30
    plausible_range: [0, 100]

  battery_voltage:
    # [TCDS] the iSc C24 variant carries a 28 V system interface.
    unit: "V"
    range: [0, 40]
    resolution: 0.01
    normal_min: 27.0
    normal_max: 29.0
    alert_min: 26.0
    alert_max: 30.0
    critical_min: 24.0
    critical_max: 31.0
    hysteresis: 0.3
    max_rate_per_s: 8
    plausible_range: [0, 45]

  alternator_current:
    # [DS] 800 W at 24-28 V.
    unit: "A"
    range: [0, 40]
    resolution: 0.1
    normal_min: 0
    normal_max: 22
    alert_max: 26
    critical_max: 30
    hysteresis: 2
    max_rate_per_s: 30
    plausible_range: [-5, 50]

  ignition_timing:
    # [MOD] ECU-scheduled on a FADEC engine; Rotax publishes no ignition map.
    # This is the parameter PRD Part 1 s3.1 PARAMETER 9 actually describes --
    # its stated 15-26 degBTDC band is a SPARK advance, not an injection angle.
    # Monitored both absolutely and as a deviation from the ECU command.
    unit: "degBTDC"
    range: [0, 60]
    resolution: 0.1
    normal_min: 5
    normal_max: 35
    deviation_alert: 2.0        # PRD Part 1 s3.1
    deviation_critical: 5.0
    # Knock-driven retard. A rising retard trend at constant power is an early
    # combustion-quality indicator (PRD Part 2 s10.6) and, because knock rises
    # with charge temperature, an early COOLING-degradation indicator too.
    # A healthy engine retards 6-7 deg at take-off power on a warm day, so the
    # alert must sit above normal operation to mean anything.
    knock_retard_alert_deg: 9.0
    knock_retard_critical_deg: 13.0
    hysteresis: 0.5
    max_rate_per_s: 60
    plausible_range: [-10, 70]

  injection_timing:
    # Start of injection, in degrees before the firing TDC. On a four-stroke
    # the port-injection event happens during the exhaust/intake stroke of the
    # 720-degree cycle, so the absolute angle is large (~370 degBTDC); it is
    # the DEVIATION from the ECU command that carries the diagnosis.
    #
    # Deviation bands from PRD Part 2 s10.2 Method C: normal < +/-1 deg CA,
    # degraded +/-1 to 3 deg, fault > +/-3 deg. These are TIGHTER than the
    # +/-2 / +/-5 in PRD Part 1 s3.1, which describes ignition timing -- see
    # docs/PRD_DEVIATIONS.md DEV-29.
    unit: "degBTDC"
    range: [200, 500]
    resolution: 0.1
    normal_min: 300
    normal_max: 450
    deviation_alert: 1.0        # PRD Part 2 s10.2 Method C
    deviation_critical: 3.0
    hysteresis: 0.3
    max_rate_per_s: 200
    plausible_range: [150, 550]

  injection_period:
    # Injection pulse width. OM Rev.4 s7.5.3: "the required fuel quantity or
    # INJECTION PERIOD is determined on the basis of the calculated air density
    # in the airbox." It is therefore the engine's primary fuel-metering
    # command, and comparing it against measured fuel flow detects a delivery
    # shortfall that neither signal reveals on its own.
    unit: "ms"
    range: [0, 30]
    resolution: 0.01
    normal_min: 1.0
    normal_max: 20.0
    duty_alert: 0.90            # injector approaching saturation
    duty_critical: 0.95
    delivery_shortfall_alert: 0.05    # commanded vs measured fuel mass
    delivery_shortfall_critical: 0.12
    hysteresis: 0.2
    max_rate_per_s: 50
    plausible_range: [0, 40]

# ------------------------------------------------------------------------------
# 2. HEALTH INDICES  (PRD Part 2 §9.2, §9.3)
# ------------------------------------------------------------------------------
health:
  # WHEN THE ENGINE'S CONDITION IS JUDGED. Engine condition trend monitoring
  # takes its readings at a stabilised, warmed-up, loaded condition, because
  # the indices measure the engine against its healthy self and a cold or
  # idling engine is not at the condition they were set for. Measured on a
  # healthy engine before this gate: at idle the alternator is below
  # regulation (electrical 0.41-0.74), cold oil pressure does not follow speed
  # (lubrication 0.02-0.17), and each throttle change read as instability
  # (rpm stability 0.71) -- composite 0.80-0.88 on start, 0.66 POOR after a
  # restart, against 0.97 warm. Outside the gate the last warm assessment is
  # HELD and published as held, with its age.
  assessment:
    min_rpm: 3500.0          # [OM s2.1] the loaded-regime line the oil minimum changes at
    # oil minimum: parameters.oil_temperature.takeoff_min, not a second number
    settle_s: 20.0           # [MOD] continuous time inside the gate before judging
    # Steady: speed held within this band over the settle window, as ECTM's
    # stability point requires. The cruise-to-descent transition used to pass
    # the gate and its transient was held as the engine's condition. [MOD]
    rpm_band_pct: 3.0
    # The engine's own residual reference (its build offset against the as-new
    # twin) is frozen after this much assessed running, not only at 60 flight
    # hours. A build offset is there from the first minute; a reference left
    # open for 60 h is the median of everything seen, so a fault arriving in
    # that time became the reference -- measured, a lubrication fault's +9 psi
    # was 6 psi absorbed fifteen minutes in and the fused alert fell back to
    # NORMAL with the fault still present. Five minutes of warm, steady
    # samples fix a median to within 0.05 psi of oil-pressure scatter. [MOD]
    # Only LEVEL-flight samples count (DEV-254): formed in the climb, the
    # reference differed from the cruise-dominated one training used by 10 degC
    # of EGT residual, and a healthy cruise read as an anomaly.
    residual_reference_settle_s: 300.0
  composite_weights:         # PRD Part 2 §9.3 — must sum to 1.0
    thermal: 0.30
    mechanical: 0.25
    electrical: 0.20
    combustion: 0.25

  # CHI interpretation bands (PRD Part 2 §9.3)
  # `action` is the machine token the advisory logic branches on. `instruction`
  # is what the OPERATOR is told to do, and lives here beside it so the two
  # cannot drift apart -- PRD Part 2 s9.5 writes every one of its own examples
  # as an instruction ("Schedule inspection within 10 flight hours"), and
  # ISA-18.2 requires an indication to carry a recommended response or it is
  # decoration that costs attention. An operator cannot act on
  # "maintain_within_25h".
  chi_bands:
    - { min: 0.90, label: "EXCELLENT", action: "none",
        instruction: "No action required." }
    - { min: 0.80, label: "GOOD",      action: "none",
        instruction: "No action required." }
    - { min: 0.70, label: "FAIR",      action: "monitor",
        instruction: "Monitor. No action required this sortie." }
    - { min: 0.60, label: "POOR",      action: "maintain_within_25h",
        instruction: "Schedule maintenance within 25 flight hours." }
    - { min: 0.50, label: "DEGRADED",  action: "maintain_within_10h",
        instruction: "Schedule maintenance within 10 flight hours." }
    - { min: 0.40, label: "CRITICAL",  action: "maintain_before_next_flight",
        instruction: "Maintenance required before next flight." }
    - { min: 0.00, label: "UNSAFE",    action: "ground_immediately",
        instruction: "Ground the aircraft. Do not dispatch." }

  # What the OPERATOR is shown, as opposed to what the model computed.
  # See docs/WHO_READS_THIS_SCREEN.md.
  #
  # `step` is the display resolution: the smallest change worth showing. Each
  # is set from the quantity's MEASURED scatter on a healthy engine, not from
  # what looks tidy. Printing a figure finer than its own noise claims a
  # precision the measurement does not have, and produces a number that cannot
  # hold still long enough to be read.
  operator_display:
    ema_alpha: 0.1             # PRD Part 2 s9.4 METHOD 1, "filters noise"
    direction_window_frames: 240   # 2 Hz x 120 s
    # HYSTERESIS, in steps. How far the smoothed value must get from what is
    # currently DISPLAYED before the display follows it.
    #
    # Must be >= 1.0. Below that there is no deadband at all, only rounding: a
    # smoothed value sitting near a step boundary rounds to either side on
    # alternate frames and the figure flips for ever. Measured at the naive
    # setting, a pure-noise input still moved the display on 31 frames out of
    # 40 -- the chatter this whole mechanism exists to remove.
    hysteresis_steps: 1.0
    steps:
      chi: 0.01                # raw index scatters 0.11 on a healthy engine
      rul_hours: 5.0           # interval is +/-100 h or worse (DEV-105)
      bsfc_deterioration_pct: 1.0   # measured swing 11.4 points when healthy
      mission_success_pct: 5.0      # measured swing 29.7 points
      fusion_score: 0.05       # only ever read as a band
    # Movement smaller than this is reported as "steady" rather than as a
    # direction, because a slope below the quantity's own scatter is scatter.
    direction_noise:
      chi: 0.02
      bsfc_deterioration_pct: 1.5
    # Below this total shortfall, the subsystem BREAKDOWN is not shown at all.
    #
    # The breakdown divides the shortfall four ways. On a healthy engine the
    # shortfall is around 0.03, so each share is a ratio of near-zero to
    # near-zero and swings on every frame -- measured, the four percentages
    # produced 40 different readings in 20 seconds. They are not wrong, they
    # are meaningless: there is no degradation to attribute. Attributing it
    # anyway trains the reader to ignore the panel by the time there IS
    # something in it worth reading.
    explanation_shortfall_floor: 0.05
    # Displayed shares are quantised to this, for the same reason every other
    # displayed figure is.
    explanation_share_step_pct: 5

  thi:                       # Thermal Health Index
    # Rescaled for the Rotax 915 iS: liquid-cooled heads, 135 degC CHT limit
    # [TCDS], 120 degC certified coolant limit [TCDS/OM].
    cht_nominal: 105.0
    cht_limit: 135.0
    coolant_nominal: 95.0
    coolant_limit: 120.0
    normal_above: 0.85
    degraded_above: 0.70
  csi:                       # CHT Spread Index
    # Liquid-cooled heads run far more even than air-cooled ones, so the
    # spread that signals a problem is much smaller.
    spread_limit: 25.0
    normal_above: 0.90
    degraded_above: 0.75
  comb_hi:                   # Combustion Health Index (NOT "CHI" - PRD FIX 2)
    egt_spread_nominal: 40.0   # [MOD] healthy 4-cylinder turbo spread
    egt_spread_limit: 200.0    # [OM] CERTIFIED EGT-split limit above 3 L/hr
    normal_above: 0.90
    degraded_above: 0.75
  eef:                       # EGT Efficiency Factor
    normal_abs_below: 0.05
    degraded_abs_below: 0.10
  lhi:                       # Lubrication Health Index
    correlation_nominal: 0.95
    # [MOD] Oil pressure is correlated with rpm only BELOW this pressure. The
    # modelled relief valve begins regulating at 0.80 x 72.5 psi = 58 psi
    # [OM §2.1: 5 bar normal maximum]; above that it holds pressure flat by
    # design, so rpm stops predicting pressure on a healthy engine. With a
    # governed propeller at 15,000 ft four of six cruise settings sat on that
    # plateau and the whole-range correlation of an as-new engine fell to
    # 0.94, under the 0.95 nominal -- a false lubrication fault. 3 psi of
    # margin keeps the valve's roll-off out of the band.
    correlation_below_psi: 55.0
    # [MOD] The oil-pressure/rpm correlation is only taken when rpm has moved
    # by more than this share of its mean (standard deviation over mean).
    # Below it the "movement" is the rpm instrument's own scatter (about 1 %
    # at a steady ground run-up), and correlating noise with noise read a
    # sound engine as a bearing fault. See HealthEstimator._correlation.
    correlation_min_rpm_cv: 0.02
    # [MOD] Pressure ABOVE the as-new twin costs the index as much, fraction
    # for fraction, as pressure below it. Symmetric because nothing published
    # weights the two differently; a healthy engine sits within about 1 % of
    # its twin (0.35 psi scatter at 54 psi), so this reads 0.99 when sound.
    high_pressure_weight: 1.0
    normal_above: 0.90
    degraded_above: 0.80
    trend_degraded_psi_per_min: -0.5
    trend_fault_psi_per_min: -2.0
  oti:                       # Oil Thermal Index
    oil_nominal: 95.0
    oil_limit: 130.0
    normal_above: 0.80
    degraded_above: 0.65
  fshi:                      # Fuel System Health Index
    normal_above: 0.95
    degraded_above: 0.90
  ffvi:                      # Fuel Flow Variance Index
    normal_above: 0.95
    degraded_above: 0.85
  mhi:                       # Mechanical Health Index
    # [MOD] 2.0 -> 3.0. The 2.0 was the PER-AXIS baseline from the engine
    # config (vibration.baseline_rms_m_per_s2), but this index is fed the
    # THREE-AXIS vector total sqrt(x^2+y^2+z^2), which on a healthy engine
    # measures 2.93 median / 3.30 p95. Comparing a vector magnitude against a
    # single-axis nominal scored every healthy engine MHI 0.845, and because
    # mechanical health is the MINIMUM of its contributors that capped the
    # composite on every airframe in the fleet.
    vib_nominal: 3.0
    vib_limit: 8.0
    normal_above: 0.90
    degraded_above: 0.75
  ehi:                       # Electrical Health Index
    weights: { v_stability: 0.5, i_capacity: 0.3, battery_soh: 0.2 }
    v_sigma_reference: 1.0     # 28 V bus [TCDS C24 variant]
    normal_above: 0.90
    degraded_above: 0.80
  rsi:                       # RPM Stability Index
    normal_above: 0.995
    degraded_above: 0.98

  trend:                     # PRD Part 2 §9.4
    ema_alpha: 0.1
    cusum_drift_allowance_K: 0.02
    cusum_threshold_H: 0.5
    window_flight_hours: 10.0

# ------------------------------------------------------------------------------
# 3. ALERT LEVELS  (PRD Part 2 §9.5  x  PRD Part 4 §4.1 MIL-STD-411F mapping)
# ------------------------------------------------------------------------------
alert_levels:
  - level: 1
    name: GREEN
    category: NORMAL          # 411F: no alert message is generated
    chi_above: 0.90
    audio: none
    record_for_maintenance: false
  - level: 2
    name: BLUE
    category: ADVISORY
    chi_above: 0.85
    audio: none
    record_for_maintenance: false     # 411F 5.2.10: advisories NOT recorded
  - level: 3
    name: YELLOW
    category: CAUTION
    chi_above: 0.75
    audio: repeat_until_ack        # double pip every 5 s until MSTR CAUT (PRD Part 4 s4.7)
    record_for_maintenance: true
  - level: 4
    name: ORANGE
    category: CAUTION
    chi_above: 0.60
    audio: repeat_until_ack
    audio_period_s: 5
    record_for_maintenance: true
  - level: 5
    name: RED
    category: WARNING
    chi_above: 0.00
    audio: continuous
    record_for_maintenance: true
    auto_action: power_reduce_50pct   # only if explicitly enabled per twin

alerting:
  min_display_seconds: 3.0            # MIL-STD-411F 5.2.5.5
  master_reset_rearm: true            # 411F 4.1.3.8
  flash_hz: 3.0                       # PRD Part 4 §8.2 (1472H 5.17.27 + 411F 4.1.3.5)
  flash_duty: 0.5
  visible_stack_depth: 6              # beyond this -> overflow (411F 5.2.5.3)
  legend_max_chars: 24                # PRD Part 4 §4.4
  audio_master_warning:               # 411F 5.3.1
    sweep_from_hz: 700
    sweep_to_hz: 1700
    sweep_seconds: 0.85
    interrupt_seconds: 0.12
  inhibits:                           # 411F 5.2.6.2
    ground_phase_inhibits: ["OIL TEMP LOW", "CHT LOW"]
    warmup_complete_oil_temp_C: 50.0
    warning_inhibits_advisories: true
    # An engine that has just fired has not built oil pressure and is not
    # burning cruise fuel. Alerting on either during the start sequence is a
    # nuisance, and 411F 4.1.1a forbids alerting when nothing is wrong.
    engine_start_settle_s: 25.0
    min_running_rpm: 1800             # [OM] certified idle minimum
    # Rate-of-change rules must not fire on a COMMANDED transient. A throttle
    # slam legitimately moves temperatures and pressures fast; that is the
    # operator's doing, not a fault.
    throttle_transient_pct_per_s: 6.0
    # Temperatures and pressures take far longer than the lever does to
    # settle after a power change, and a rate alert is meaningless until
    # they have. 30 s covers the head and oil thermal response.
    transient_settle_s: 30.0

# ------------------------------------------------------------------------------
# 4. THE EIGHT REQUIRED FAULTS  (PRD Part 2 §10.1 - §10.8)
# ------------------------------------------------------------------------------
faults:

  misfire:                                    # §10.1
    rpm_drop_threshold: -50.0                 # Method A, per power stroke
    rpm_drop_duration_ms: 100
    egt_drop_sigma: 3.0                       # Method B
    vibration_subharmonic_ratio: 2.0          # Method D: 0.5x RPM peak
    rate_alert_percent: 5.0
    precursor_egt_cv: 0.08

  injector_abnormal:                          # §10.2
    fuel_cv_degraded: 0.05
    fuel_cv_fault: 0.10
    egt_spread_degraded: 80.0    # [MOD] 40% of the certified 200 degC limit
    egt_spread_fault: 150.0      # [MOD] 75% of the certified limit
    timing_deviation_degraded_deg: 1.0
    timing_deviation_fault_deg: 3.0
    cqi_normal: [0.95, 1.05]
    cqi_fault: [0.85, 1.15]

  cooling_degradation:                        # §10.3 (PS typo "Coding" = Cooling)
    cht_residual_degraded_C: 4.0
    cht_residual_fault_C: 10.0
    coolant_residual_degraded_C: 4.0
    coolant_residual_fault_C: 10.0
    residual_trend_C_per_flight_hour: 0.10
    cef_degraded: 1.05
    cef_fault: 1.20
    thermal_tau_normal_s: [30, 60]
    thermal_tau_degraded_s: 90

  lubrication_issue:                          # §10.4
    oil_rpm_correlation_degraded: 0.95
    oil_rpm_correlation_fault: 0.85
    # Oil pressure residual against the as-new twin, judged above 3500 rpm where
    # the OM 2.0 bar (29 psi) minimum applies. Healthy cruise runs ~46-58 psi
    # (3.2-4.0 bar); -10 psi takes a 50 psi engine to 40 psi, about a third of
    # the way to the certified minimum, and -5 psi is the early warning. Sensor
    # noise is ~0.35 psi. [MOD] -- replaces the correlation indicator (PS1-03).
    oil_pressure_residual_degraded_psi: -5.0
    oil_pressure_residual_fault_psi: -10.0
    pressure_trend_degraded_psi_per_min: -0.5
    pressure_trend_fault_psi_per_min: -2.0
    dp_dt_normal_psi_per_C: [-0.5, -0.3]
    bearing_envelope_degraded_x: 2.0
    bearing_envelope_fault_x: 5.0

  sensor_drift:                               # §10.5
    bias_drift_fraction_fs: 0.02
    bias_fault_fraction_fs: 0.05
    residual_variance_fault_x: 3.0
    cross_correlation_cht_egt_min: 0.70
    cross_correlation_oil_rpm_min: 0.95
    voting_rule: "3_of_5"

  combustion_instability:                     # §10.6
    egt_sigma_unstable_C: 15.0
    egt_sigma_severe_C: 40.0
    cantera_residual_unstable: 0.10
    kurtosis_normal: 3.0
    kurtosis_knock: 6.0
    cov_imep_degraded: 0.03
    cov_imep_fault: 0.05

  overheating_trend:                          # §10.7
    cht_slope_normal_C_per_min: 0.5
    cht_slope_trending_C_per_min: 2.0
    thermal_margin_normal_C: 4.0
    thermal_margin_degraded_C: 8.0
    level_shift_C: 6.0

  abnormal_vibration:                         # §10.8
    fft_peak_degraded_x: 3.0
    fft_peak_fault_x: 5.0
    envelope_degraded_x: 2.0
    envelope_fault_x: 5.0
    kurtosis_fault: 6.0
    crest_factor_normal: 6.0
    crest_factor_fault: 8.0

# ------------------------------------------------------------------------------
# 5. DETECTORS  (PRD Part 2 §11)
# ------------------------------------------------------------------------------
detectors:
  tier1:
    max_latency_ms: 5
    persistence_default_s: 60
  tier2:
    isolation_forest: { n_estimators: 100, contamination: 0.05, max_samples: 256 }
    cblof:            { n_clusters: 8, alpha: 0.9, beta: 5 }
    matrix_profile:   { window_size: 100, exclusion_zone: 50 }
    ensemble_weights: { iforest: 0.4, cblof: 0.3, matrix_profile: 0.3 }
    alert_l3_above: 0.70
    alert_l4_above: 0.90
    max_latency_ms: 50
  tier3:
    sequence_length: 30
    n_features: 7
    lstm_ae: { encoder_units: 32, bottleneck: 16, decoder_units: 32 }
    classifier: { lstm1: 64, dropout: 0.2, lstm2: 32, dense: 32, n_classes: 8 }
    threshold_percentile: 95
    max_latency_ms: 100
  fusion:                    # PRD Part 2 §11.2
    weights: { rule: 0.3, statistical: 0.3, deep: 0.4 }
    l3: { s_final_above: 0.60, s_rule_above: 0.50 }
    l4: { s_final_above: 0.80, s_statistical_above: 0.70, s_deep_above: 0.80 }
    l5: { s_final_above: 0.95, s_rule_equals: 1.0 }
    # [MOD] Added. PRD Part 2 §11.2 as written cannot raise ANY alert from the
    # models alone: with the rule engine silent S_rule = 0, so S_final peaks at
    # 0.3(0)+0.3(1)+0.4(1) = 0.70 -- below the 0.80 that L4 needs -- while L3 is
    # gated behind S_rule > 0.50, i.e. the rules must already be at ORANGE.
    # Every residual-based finding this system exists to produce would have been
    # discarded on the way to the operator. This path lets two independently
    # agreeing model tiers raise a PREDICTIVE caution with no limit crossed.
    # An EMERGENCY still requires S_rule = 1.0, exactly as the PRD specifies.
    l3_predictive: { s_statistical_above: 0.70, s_deep_above: 0.70 }
  confidence_floor: 0.55     # below this -> rule-based fallback (PRD Part 4 §7.4b)

# feature normalisation for the 7-feature model input (PRD Part 2 §12.3)
feature_norm:
  rpm:            { center: 4000, scale: 2000 }
  cht_avg:        { center: 105,  scale: 25 }
  egt_avg:        { center: 820,  scale: 150 }
  oil_pressure:   { center: 50,   scale: 25 }
  oil_temperature: { center: 100, scale: 30 }
  fuel_flow:      { center: 22,   scale: 15 }
  vibration_rms:  { center: 2.5,  scale: 7.5 }

# ------------------------------------------------------------------------------
# 6. RUL  (PRD Part 2 §12)
# ------------------------------------------------------------------------------
rul:
  # [MOD] The horizon beyond which the RUL target is CAPPED rather than counted
  # down. PRD Part 2 §12.3 says to cap at RUL_max = TBO, but that does nothing:
  # the raw countdown already tops out near TBO, so the "cap" never binds and
  # the network is asked to predict whether a healthy engine has 900 or 1100
  # hours left. Nothing in a 50-second window distinguishes those, so it is
  # asked to learn noise -- burning capacity and inflating the error on the
  # part of the curve that carries every actual decision.
  #
  # 400 h is a third of the 1200 h TBO, the same proportion as the 125-of-360
  # cap used on NASA C-MAPSS. Operationally it is the point beyond which no
  # maintenance decision changes: "600 hours left" and "800 hours left" both
  # mean "not now".
  prediction_horizon_hours: 400.0
  maintenance_chi_threshold: 0.60
  health_onset_threshold: 0.90       # t_onset when CHI first drops below this
  confidence_level: 0.95
  nasa_score_early_tau: 13.0         # penalty asymmetry constant
  # READ BY layer3_ai/rul_lstm.rul_loss. Until 2026-09-07 nothing read this
  # key at all -- the values were hardcoded as defaults that happened to match,
  # so editing it here changed nothing. Same class of fault as DEV-201.
  loss_weights: { mse: 0.7, nasa_score: 0.3 }

  # Extra weight on the SQUARED error when the prediction is LATE, i.e. claims
  # more remaining life than there is. Not a taste parameter: `scale = 100` in
  # rul_loss compresses the exponential enough that at a 200 h error the
  # training loss charged late only 1.75x early, while the NASA score the model
  # is judged by charges 101x. The model was optimised on a near-symmetric
  # objective, graded on an asymmetric one, and produced a +44.5 h LATE bias on
  # the informative band -- the opposite of the conservative bias the
  # asymmetric-loss literature reports.
  #
  # Weighting the squared term is the stable remedy that literature prefers to
  # steepening the exponential: quadratic, so it cannot overflow, and it bites
  # hardest on the large late errors that are the actual problem. 3.0 takes the
  # measured late/early ratio at 200 h from 1.21x to 2.65x. It is a starting
  # value chosen for that effect and is NOT tuned against test.
  # 1.0 restores the previous behaviour exactly.
  late_weight: 3.0
  # [MOD] Acceptance criteria rebuilt from research rather than invention.
  # DEV-178 (metrics), DEV-186 (these numbers). Every line below carries its
  # PROVENANCE, because the failure being corrected was not a wrong number --
  # it was a number with no source.
  #
  # WITHDRAWN, kept visible because deleting a target we failed is not the
  # same as showing why it was the wrong target:
  #     rmse_flight_hours: 25.0   -> DEV-102/179. 0.18x the label sigma where
  #                                  published SOTA is ~0.28x: it demanded
  #                                  better-than-SOTA in relative terms.
  #     r2: 0.85                  -> implied ~53.7 h, twice as loose as the
  #                                  RMSE target in the same block. Mutually
  #                                  infeasible.
  #     mape: 0.15                -> undefined as RUL -> 0, which is the only
  #                                  region that carries a decision.
  #
  # THE RESEARCH FINDING THAT SHAPES ALL OF THIS: no international standard
  # publishes a numeric RUL accuracy requirement. ISO 13381, ISO 13374, SAE
  # ARP6883/6887 and the IEEE PHM standards define METRICS AND PROCESS and
  # then require the organisation to set acceptance criteria from its own
  # application; NIST's survey of the standards landscape states this
  # explicitly. So "the international target" does not exist, and any number
  # presented as one is invented. What DOES exist is (1) published
  # conventions and (2) measured state of the art. Targets below are labelled
  # by which of those they come from, or by the fact that they come from
  # neither.
  targets:

    # -- TIER 1: published convention, adopted unchanged ---------------------
    # Saxena et al. (NASA, PHM 2008) and the C-MAPSS literature that reports
    # against it. Deliberately NOT derived from our own error distribution: a
    # tolerance fitted to our own data is one we have already met by
    # construction, which is the DEV-95 mistake wearing a new hat.
    alpha: 0.2
    lambda: 0.5

    # -- TIER 2: parity with measured state of the art -----------------------
    # Applies to scripts/benchmark_cmapss.py, NOT to the engine. Published
    # C-MAPSS SOTA is RMSE 12.6 / 13.1 / 12.7 / 14.0 on FD001-FD004; this
    # architecture, untuned, measured 1.09x to 1.36x of that (DEV-182,
    # data/benchmarks/results.jsonl). The gate is set at the top of the band
    # this method demonstrably occupies, so a regression in the METHOD is
    # caught while a re-tune is not required to pass.
    benchmark_ratio_to_sota: 1.40

    # -- TIER 3: no international number exists ------------------------------
    # For alpha-lambda, relative accuracy and RMSE/sigma there is no published
    # threshold AND no published distribution to calibrate against: these are
    # trajectory metrics, and C-MAPSS yields only one labelled RUL per test
    # unit, so the literature reports them rarely. Inventing a number here is
    # precisely what produced the 25 h target.
    #
    # So the bar is a SELF-BENCHMARK, and the claim it encodes is narrow and
    # checkable: this estimator must do on OUR engine what it provably does on
    # the world's data. Each value is the WORST of the four C-MAPSS subsets
    # measured with identical code and identical protocol (all windows), so it
    # is attainable by construction -- this method has already achieved it.
    # Measured 2026-09-06, seed 0, 25 epochs; see data/benchmarks/results.jsonl.
    alpha_lambda: 0.70              # C-MAPSS range 0.708 - 0.830
    relative_accuracy: 0.82         # C-MAPSS range 0.827 - 0.901
    rmse_sigma_ratio: 0.71          # C-MAPSS range 0.473 - 0.705 (lower better)

    # -- DERIVED FROM THEORY, not from any benchmark -------------------------
    # DEV-105: split-conformal guarantees coverage under EXCHANGEABILITY, and
    # windows from different engines are not exchangeable. 95 % is unreachable
    # on held-out engines for a reason that is a theorem, not a shortcoming.
    interval_coverage_unseen: 0.80

    # -- REPORTED, NEVER GATED -----------------------------------------------
    # nasa_score: DEV-103 measured 478 to 3,108 across three seeds. It is
    # exponential in the error, so one bad window dominates it. Kept as a
    # sanity bound only, never as a single-run go/no-go.
    nasa_score: 500.0
    #
    # late_fraction: a ceiling, not a safety gate. The SAFETY argument is
    # carried by nasa_score, which penalises late predictions asymmetrically
    # BY CONSTRUCTION (DEV-66), and by DEV-104's relative criterion that
    # fusion must REDUCE the late rate. The absolute value here is the worst
    # this method produced on C-MAPSS (0.317), rounded; it exists to catch a
    # collapse, not to certify conservatism.
    late_fraction: 0.35
    #
    # prognostic_horizon: DELIBERATELY NOT A TARGET, and the reason is the
    # whole point of this exercise. An earlier draft of this block set it at
    # 100 h on operational reasoning that sounded sensible. Measuring it
    # destroyed that: with the same code on C-MAPSS, a method within 1.09x of
    # world state of the art earns a horizon of 0.0 / 0.0 / 1.5 / 6.5 cycles.
    # Saxena's "and STAYS inside the cone" rule is near-binary against any
    # noisy estimator, so a horizon gate would have been a second unreachable
    # target invented the same way as the first. It is computed and REPORTED
    # by layer3_ai/prognostic_metrics.py because it is diagnostic; it gates
    # nothing.

# ------------------------------------------------------------------------------
# 7. PIPELINE / LATENCY BUDGET  (PRD Part 1 §6.4 as corrected by FIX 3)
# ------------------------------------------------------------------------------
pipeline:
  edge_critical_path_ms: 50          # rules only, onboard, bypasses physics/AI
  target_median_ms: 100
  target_p95_ms: 200
  dashboard_refresh_s: 2.0
  # How often the READINGS are pushed, as opposed to the whole snapshot.
  #
  # dashboard_refresh_s governs the full snapshot, chart series included. It is
  # 2.0 s, and streaming everything at that rate meant every engine value on
  # the display stepped once every two seconds -- against PRD Part 4 s8.3,
  # which requires Zone B at the telemetry rate, trend charts at 4 Hz and
  # derived indices at 1 Hz. 0.25 s puts the live readings at 4 Hz without
  # resending the two 30 KB chart series to do it.
  dashboard_live_refresh_s: 0.25
  telemetry_hz: 10
  stale_after_intervals: 3           # PRD Part 4 §7.1
  # FADEC inter-lane agreement (PRD Part 1 §8.3 Method 5). Two lanes' readings
  # of one quantity disagree when they differ by more than BOTH the fraction of
  # the larger reading and the channel's floor. [MOD] Rotax publishes no
  # inter-lane tolerance. The fraction was a bare 0.05 in can_ingest and
  # sensor_fusion. The floors are 6 x sqrt(2) x the SIMULATED instrument noise
  # (engine_sim._default_sensors), so two healthy simulated sensors cross them
  # about once in 10^9 samples. A fraction of a temperature in degC means
  # nothing: at 20 degC 5 % is 1 degC and at 0 degC it is nothing at all, which
  # is why the floor exists. On hardware the floors must be re-derived from the
  # sensor datasheets or bench data.
  lane_agreement_fraction: 0.05
  lane_agreement_floor:
    rpm: 34.0                        # rpm   (simulated sigma 4.0)
    manifold_pressure: 0.034         # bar   (simulated sigma 0.004)
    manifold_air_temperature: 3.4    # degC  (simulated sigma 0.4)
  # FROZEN READINGS (audit 15 Sep, P0-5). A working sensor's noise makes a long
  # run of IDENTICAL readings improbable, and how improbable depends only on its
  # noise relative to its resolution. can_ingest derives, per sensor, the run
  # length a working sensor produces with probability below
  # frozen_false_alarm_probability at a steady value, and removes the reading
  # from there. [MOD] The ratios are the SIMULATED instruments'
  # (engine_sim._default_sensors; a test holds them equal); on hardware they
  # must be measured, because a sensor quieter than this would be flagged.
  # Measured on healthy flights (seed 11 at 0.5 s for 1,100 s, seed 5 at 0.1 s
  # for 300 s): the longest identical run on any listed sensor was 9 readings.
  # ECU commands and air data are not listed: they hold still legitimately
  # (injection_period, the commanded pulse width, repeated 981 times).
  frozen_false_alarm_probability: 1.0e-9
  frozen_noise_over_resolution:
    rpm: 4.0
    cht: 6.0
    coolant_temperature: 4.0
    egt: 7.0
    oil_pressure: 2.4
    oil_temperature: 3.5
    fuel_flow: 12.0
    manifold_pressure: 4.0
    manifold_air_temperature: 4.0
    fuel_pressure: 2.0
    vibration_rms: 5.0
    battery_voltage: 3.0
    alternator_current: 1.5
    battery_current: 2.0
    injection_timing: 1.5
    ignition_timing: 1.2
  # SENSORS THAT STOP FOLLOWING THE ENGINE (audit 15 Sep, P0-5), judged against
  # the as-new twin in layer4_core/sensor_response.py. Over response_window_s,
  # if the twin's prediction moves by at least response_excitation_x noise and
  # the reading by no more than response_flat_x noise, the reading is removed.
  # Measured (60 s windows, prediction moving >= 5 noise; seeds 11, 3, 7 and
  # cooling, lubrication and overheating faults at severity 0.8): a working
  # sensor's spread was never below 3.98 noise, a stuck one's never above 1.23.
  # [MOD] 2.0 is chosen between them on that evidence, from one flight profile.
  # Noise in each channel's own units, from the simulated instruments.
  response_window_s: 60.0
  response_excitation_x: 5.0
  response_flat_x: 2.0
  # A removed reading is believed again when, over a whole window with the
  # engine steady, its mean sits within this many noise of the twin's. Without
  # it a removal lasted until the next large power change -- in a long cruise,
  # the rest of the sortie. [MOD]
  response_agree_x: 3.0
  # "Not following" must hold this long before a reading is removed: a probe
  # lags the metal it measures and the twin's prediction does not. [MOD]
  response_persist_s: 15.0
  response_noise:
    cht: 0.6                         # degC
    coolant_temperature: 0.4         # degC
    egt: 3.5                         # degC
    oil_pressure: 0.348              # psi (0.024 bar)
    oil_temperature: 0.35            # degC
    fuel_flow: 0.12                  # L/hr
  link_degraded_after_s: 2.0
  link_lost_after_s: 5.0
  edge_buffer_hours: 72

# MAVLink 2 EFI_STATUS (message 225, common.xml) to a ground station over UDP.
# Off by default: nothing should be sent to a port nobody is listening on.
# 14550 is the port QGroundControl and Mission Planner listen on out of the box.
mavlink:
  enabled: false
  host: "127.0.0.1"
  port: 14550
  rate_hz: 2.0
  system_id: 1
  component_id: 1                    # MAV_COMP_ID_AUTOPILOT1

# ------------------------------------------------------------------------------
# 8. SENSOR FUSION / SIGNAL PROCESSING  (PRD Part 1 §8)
# ------------------------------------------------------------------------------
fusion:
  hampel: { window: 7, n_sigma: 3.0 }
  # Exponential smoothing of the Tier-2 and Tier-3 scores before they are
  # fused, taken over ASSESSED samples only (health.assessment). A healthy
  # engine's per-sample Tier-2 score scattered 0.03-0.61 in a steady cruise
  # and a single sample over the 0.5 single-tier gate raised ADVISORY on its
  # own. 0.05 is a 20-sample (10 s) time constant; the scatter of the smoothed
  # score is then ~0.03 against the same 0.5 gate. [MOD]
  tier_smoothing_alpha: 0.05
  resample_hz: 10
  max_interpolation_gap_samples: 3
  cht_lowpass_fc_hz: 1.0
  oil_lowpass_fc_hz: 2.0
  rpm_moving_average_samples: 10
  correlation_window_s: 60
  kalman:
    bias_process_noise: 1.0e-6
    measurement_noise: 1.0e-2
  fft: { n: 4096, window: "hann", overlap: 0.5, fs: 10000 }

# ------------------------------------------------------------------------------
# 9. MAINTENANCE ADVISORY  (PRD Part 2 §13.2, §16.3)
# ------------------------------------------------------------------------------
# ------------------------------------------------------------------------------
# LIVE ENGINE AGAINST ITS TWIN -- what the operator sees beside each reading
# ------------------------------------------------------------------------------
# The certified limit says when a value is dangerous. The twin says what the
# value SHOULD be right now: the as-new engine at the same rpm, throttle,
# altitude and air temperature, plus this engine's own build offset (learned
# from its first warm, steady running and then frozen). The difference is the
# early warning -- a head 12 K hotter than it should be is a cooling fault
# long before it is 135 degC.
#
# Graded only while the engine is warm, loaded and steady (health.assessment),
# because in warm-up and transients the difference is the operating point,
# not the engine. Smoothed over `smoothing_s` so one noisy sample does not
# flash a symbol. `sense` is which way is bad.
twin_compare:
  smoothing_s: 10.0
  channels:
    cht_max:
      residual: cht
      baseline: res_cht
      unit: "degC"
      sense: above
      degraded: 4.0      # faults.cooling_degradation.cht_residual_degraded_C
      fault: 10.0        # faults.cooling_degradation.cht_residual_fault_C
    coolant_temperature:
      residual: coolant
      baseline: res_coolant
      unit: "degC"
      sense: above
      degraded: 4.0      # faults.cooling_degradation.coolant_residual_degraded_C
      fault: 10.0
    egt_max:
      residual: egt
      baseline: res_egt
      unit: "degC"
      sense: both
      # [MOD] EGT has no residual threshold of its own. 25 K is about a fifth
      # of the 130 K between typical cruise EGT and the 950 degC limit, and
      # well clear of the +/-10 K a healthy engine scatters around its twin.
      degraded: 25.0
      fault: 50.0
    oil_pressure:
      residual: oil_pressure
      baseline: res_oil_pressure
      unit: "psi"
      sense: below
      degraded: 5.0      # faults.lubrication_issue.oil_pressure_residual_degraded_psi
      fault: 10.0        # faults.lubrication_issue.oil_pressure_residual_fault_psi
      min_rpm: 3500.0    # judged above 3500 rpm, as that fault definition is
    # The rest of PS section B. RPM is not here: it is the twin's INPUT (the
    # shadow runs at the measured speed -- shadow_model.py), so the twin has no
    # independent opinion of it; speed is monitored against its limits.
    oil_temperature:
      residual: oil_temperature
      baseline: res_oil_temperature
      unit: "degC"
      sense: above
      # [MOD] the oil takes its heat from the same heads, so the cooling
      # residual figures are used. Healthy scatter ~ +/-1 degC.
      degraded: 5.0
      fault: 10.0
    fuel_flow:
      residual: fuel_flow
      baseline: res_fuel_flow
      unit: "L/h"
      sense: both
      relative: true     # a fraction of the flow the twin expects
      degraded: 0.05     # faults.injector_abnormal.fuel_cv_degraded
      fault: 0.10        # faults.injector_abnormal.fuel_cv_fault
    manifold_pressure:
      residual: manifold_pressure
      baseline: res_manifold_pressure
      unit: "bar"
      sense: both
      # [MOD] healthy scatter ~ +/-0.006 bar; 0.05 bar is a boost or intake
      # leak worth a look, 0.10 bar one worth grounding for.
      degraded: 0.05
      fault: 0.10
    vibration_rms_total:
      kind: shadow
      measured: vibration.rms_total
      output: vibration_rms_m_s2
      # The accelerometer's three axes read 1.0, 0.82 and 0.64 of the engine's
      # vibration (its mounting); the total is their root-sum-square.
      gain: 1.443
      unit: "m/s2"
      sense: above
      relative: true
      degraded: 1.0      # faults.abnormal_vibration.envelope_degraded_x (2x)
      fault: 4.0         # faults.abnormal_vibration.envelope_fault_x (5x)
    bus_voltage:
      kind: shadow
      measured: electrical.bus_voltage
      output: battery_voltage_v
      unit: "V"
      sense: both
      # [MOD] a regulated bus scatters ~ +/-0.05 V about the twin; half a volt
      # is a regulator or alternator drifting, a volt is one failing.
      degraded: 0.5
      fault: 1.0
    injection_timing:
      # Timing's twin is the FADEC's own command: each cylinder's measured
      # injection against what the ECU scheduled (PRD Part 2 s10.2 Method C).
      kind: command
      unit: "deg"
      sense: above
      degraded: 1.0      # faults.injector_abnormal.timing_deviation_degraded_deg
      fault: 3.0         # faults.injector_abnormal.timing_deviation_fault_deg

advisory:
  rules:
    - id: R1
      # Aligned with the UNSAFE chi band (< 0.40). At 0.60 this rule said
      # "GROUND AIRCRAFT IMMEDIATELY" where the band says "maintain within
      # 10 h" (SAF-10). R1-R6 document PRD Part 2 s13.2; the live advisory
      # realises them through health.chi_bands and the action library below.
      when: { chi_below: 0.40 }
      priority: CRITICAL
      timeframe: "Before next flight"
      message: "GROUND AIRCRAFT IMMEDIATELY. Engine unsafe for flight. Schedule emergency inspection."
    - id: R2
      when: { chi_below: 0.70, rul_below_hours: 25 }
      priority: HIGH
      timeframe: "Within 10 flight hours"
      message: "Schedule maintenance within 10 flight hours. {subsystem} degradation detected."
    - id: R3
      when: { chi_below: 0.80, any_degradation_below: 0.75 }
      priority: MEDIUM
      timeframe: "Within 50 flight hours"
      message: "Monitor closely. {component} showing degradation. Plan maintenance within 50 flight hours."
    - id: R4
      when: { chi_above: 0.80 }
      priority: LOW
      timeframe: "At next scheduled maintenance"
      message: "Normal operation. Continue monitoring. Next inspection at {tbo_remaining} hours."
    - id: R5
      when: { predicted_cht_above: 125 }
      priority: MISSION_PLANNING
      timeframe: "Before mission"
      message: "MISSION ADVISORY: planned profile may exceed thermal limits. Consider reduced power or alternate route."
    - id: R6
      when: { rul_below_mission_multiple: 1.5 }
      priority: MISSION_CRITICAL
      timeframe: "Before mission"
      message: "MISSION ABORT RISK: estimated RUL ({rul} h) is below 1.5x planned mission duration ({mission_duration} h)."

  actions:                            # PRD Part 2 §16.3 maintenance action library
    - id: A1
      name: "Oil Change"
      # or_hours_since_oil_change_above [MML] 05-20-00 maintenance schedule: the
      # oil change is part of every 100 h check (every 50 h when leaded AVGAS is
      # used for more than 30 % of operation). The measured trigger a real
      # aircraft has; oil_quality is a simulator factor no sensor reports (ML-02).
      trigger: { oil_quality_below: 0.75, or_viscosity_increase_above: 0.25,
                 or_hours_since_oil_change_above: 100 }
      downtime_hours: 1
      cost_inr: 3000
      parts: ["Oil 5 L", "Filter", "Crush washer"]
      procedure: ["Drain oil", "Replace filter", "Refill with specified grade"]
    - id: A2
      name: "Cooling System Flush"
      trigger: { cooling_efficiency_below: 0.70, or_cht_residual_above: 10.0 }
      downtime_hours: 2
      cost_inr: 5000
      parts: ["Coolant 8 L", "Flush chemical"]
      procedure: ["Drain coolant", "Flush with cleaner", "Refill with specified coolant"]
    - id: A3
      name: "Injector Cleaning / Replacement"
      trigger: { egt_spread_above: 150.0, or_fuel_cv_above: 0.10 }
      downtime_hours: 3
      cost_inr: 12000
      cost_replace_inr: 25000
      parts: ["Injector seals", "O-rings"]
      procedure: ["Remove injectors", "Ultrasonic clean or replace"]
    - id: A4
      name: "Spark Plug Replacement"
      # ground_*: past this a measured finding grounds the aircraft on its own
      # (SAF-06). 0.50 = one cylinder cold in more than half of cruise samples,
      # i.e. effectively a dead cylinder on a single-engine airframe [MOD].
      trigger: { misfire_rate_above: 0.05, or_ignition_energy_drop_above: 0.15,
                 ground_misfire_rate_above: 0.50 }
      downtime_hours: 0.5
      cost_inr: 2000
      parts: ["Spark plugs x4"]
      procedure: ["Remove old plugs", "Inspect", "Gap and install new plugs"]
    - id: A5
      name: "Bearing Inspection"
      # 15x = three times the inspection limit: a defect order that far above
      # its envelope floor is spall propagation, not an early finding [MOD].
      trigger: { bearing_envelope_above_x: 5.0, or_oil_correlation_below: 0.80,
                 ground_bearing_envelope_above_x: 15.0 }
      downtime_hours: 4
      cost_inr: 20000
      parts: ["Bearing set (if replacement needed)"]
      procedure: ["Borescope inspection", "Oil analysis", "Vibration analysis"]
    - id: A6
      name: "Turbocharger Inspection"
      # or_wastegate_closure_above_pct [MOD]: the wastegate sitting this many
      # percentage points more closed than the as-new twin's at the same point.
      # A worn turbocharger is compensated by the closed-loop boost control, so
      # below its limit it shows as wastegate position, not as lost boost
      # (review PHY-07).
      trigger: { boost_drop_above: 0.20, or_egt_rise_above_C: 50.0,
                 or_wastegate_closure_above_pct: 15.0 }
      downtime_hours: 6
      cost_inr: 35000
      parts: ["Turbocharger rebuild kit or replacement"]
      procedure: ["Visual inspection", "Shaft play measurement", "Compressor map test"]
    - id: A7
      name: "Complete Engine Overhaul"
      # or_p_fail_above is the calibrated probability of failure within
      # p_fail_horizon_h hours. It sits BESIDE the RUL trigger, not in place of
      # it: the point RUL is late 55% of the time, so it stays as a floor while
      # the better-measured number (engine-grouped AUC 0.926 at 25 h) is what
      # actually catches the case the RUL misses. 0.35 is deliberately well
      # above the 25 h base rate of 0.053 -- an overhaul is a 400-hour, 5-lakh
      # action and should not fire on a marginal probability.
      trigger: { chi_below: 0.50, or_rul_below_hours: 10,
                 or_p_fail_above: 0.35, or_p_fail_clear_below: 0.25,
                 p_fail_horizon_h: 25 }
      # or_p_fail_clear_below: alarm deadband (ISA-18.2 / EEMUA 191). Trip above
      # 0.35, release only below 0.25, so a probability sitting on the line does
      # not ground and release the aircraft on alternate ticks (SAF-05) [MOD].
      downtime_hours: 400
      cost_inr: 500000
      parts: ["Full overhaul kit", "Gaskets", "Bearings", "Rings", "Valves"]
      procedure: ["Full disassembly", "Inspection", "Replace worn parts", "Reassemble", "Test run"]

# ------------------------------------------------------------------------------
# 10. SECURITY  (PRD Part 1 §2.5, PRD Part 3 §20)
# ------------------------------------------------------------------------------
security:
  jwt:
    algorithm: RS256
    access_token_minutes: 15
    refresh_token_hours: 24
    issuer: "dt-uav-gcs"
  # The problem statement names three audiences -- "UAV operators, propulsion
  # engineers and maintenance team" -- and these roles are those three plus the
  # commander. Each role is therefore scoped to the DECISION it actually makes,
  # which is a stricter test than "what might be interesting to it".
  #
  #   read:mission  is the Go/No-Go call. It belongs to the OPERATOR, because
  #                 continuing or aborting the sortie is the operator's
  #                 decision; withholding it left the person flying the
  #                 aircraft unable to see the reliability assessment made for
  #                 the flight they were conducting. It is deliberately
  #                 narrower than read:prognostics: the operator gets the
  #                 verdict, not the component-level RUL machinery behind it.
  #
  #   read:advisory is the costed maintenance plan. The MAINTENANCE role held
  #                 it but could not reach the page that displays it, and the
  #                 ENGINEER could reach the page but not the data -- so
  #                 between them they held both halves and neither could use
  #                 it. An engineer diagnosing deterioration needs to see the
  #                 maintenance consequence of the diagnosis.
  #
  #   read:prognostics is RUL and its intervals. MAINTENANCE plans against it,
  #                 so withholding it left the planner planning blind.
  roles:
    #   control:sortie  starts the next sortie once the last one has ended with
    #                 the engine shut down. The operator is the one flying it.
    #   fly:mission   prepares the aircraft allotted to them, starts its engine
    #                 after the checklist, launches, recalls, debriefs.
    #   raise:defect  reports a snag. Every role that touches the aircraft can.
    #   read:ops      the squadron board and each aircraft's technical log.
    ROLE_OPERATOR:    ["read:telemetry", "read:health", "read:alerts", "ack:alert", "read:replay",
                       "read:mission", "control:sortie", "read:ops", "fly:mission",
                       "raise:defect"]
    #   read:reports  is the post-flight record: events tagged with the flight
    #                 phase they occurred in, exceedances with time-above, and
    #                 the stabilised cruise datum. That is Engine Condition
    #                 Trend Monitoring material, and PRD Part 3 s19.5 gives the
    #                 propulsion engineer "engine performance, degradation
    #                 analysis, model validation" as their focus -- they are the
    #                 audience for it. Withholding it left the one role whose
    #                 job is trend analysis unable to read the trend data.
    #   write:engines  authors engine definitions (configs/engines/*.yaml) from
    #                 the console and checks them against the running code.
    #                 The propulsion engineer owns the engine model; FITTING an
    #                 engine to an aircraft (admin:fleet, an engine change)
    #                 stays with the commander.
    ROLE_ENGINEER:    ["read:telemetry", "read:health", "read:alerts", "ack:alert", "read:replay",
                       "read:mission", "read:physics", "read:prognostics", "read:advisory",
                       "read:reports", "run:simulation", "write:sim_params", "write:engines",
                       "read:ops", "review:defects", "raise:defect"]
    #   review:defects (engineer) dispositions the defects the twin raises --
    #                 confirm, defer with an hours limit, no fault found -- and
    #                 sets operating limitations. write:maintenance (maintainer)
    #                 rectifies, ground-runs and signs the maintenance release.
    #                 plan:mission and admin:fleet are the commander's, by "*".
    ROLE_MAINTENANCE: ["read:telemetry", "read:health", "read:alerts", "ack:alert", "read:replay",
                       "read:mission", "read:prognostics", "read:advisory", "write:maintenance",
                       "read:reports", "read:ops", "raise:defect"]
    # The commander alone holds admin:users (accounts), plan:mission (tasking
    # and allotment) and admin:fleet (engine changes), through the wildcard.
    ROLE_COMMANDER:   ["*"]
  audit:
    hash_algorithm: sha256
    # REPORT_EXPORT: a report leaving the system as a filed document is exactly
    # the kind of event an audit log exists to record -- the digest written
    # here is what lets a printout be matched back to this entry.
    log_events: ["AUTH", "AUTHZ_DENY", "STATE_MUTATION", "ALERT_GENERATED", "ALERT_ACK",
                 "MODEL_UPDATE", "MAINTENANCE_ACTION", "THRESHOLD_CHANGE",
                 "REPORT_EXPORT", "ENGINE_CONFIG", "ENGINE_CHANGE", "USER_ADMIN",
                 "MISSION", "SORTIE_START"]
  rate_limit:
    requests_per_minute: 600

# ---------------------------------------------------------------------------
# Report identity. Everything on the post-flight report's cover that is a
# property of the DEPLOYMENT rather than of the flight: where this ground
# station is, who operates it, and how its output is marked.
#
# These are config rather than code because a second ground station at a
# different site runs the same binary and must not produce a report claiming
# to be from this one.
# ---------------------------------------------------------------------------
report:
  location: "Pokhran Test Range, Rajasthan"
  operator: "Ministry of Defence, Government of India"
  classification: "Restricted (Government Use Only)"
  # Prefix for the mission reference this ground station generates when the
  # tasking authority has not supplied a number of its own.
  mission_prefix: "MISSION"
  # Timekeeping. DGCA CAR 66 records the maintenance engineer's logbook in UTC
  # and is explicit that an entry must never mix local and Zulu, so UTC is the
  # record time. IST is shown beside it because the crew reading this at an
  # Indian base works in IST -- both are labelled, never one bare time.
  local_timezone: "IST"
  local_utc_offset_minutes: 330
  # Engine serial. The twin knows its engine TYPE; the serial is the physical
  # unit, which only the installation record has.
  engine_serial: ""

# ------------------------------------------------------------------------------
# EXCEEDANCE GRADES  (post-flight report, REP-02)
# ------------------------------------------------------------------------------
# Flight-data-monitoring practice (UK CAA CAP 739) grades every event 1 to 3
# against SEPARATE limits instead of reporting raw excess. Level 1 is the
# certified limit itself; levels 2 and 3 are how far beyond it, in the
# parameter's own units (below it, for a minimum). The margins are modelling
# choices for this prototype [MOD] and are meant to be replaced by the
# operator's FDM programme values. Keys match the exceedance names in live.py.
exceedance_grades:
  cylinder head temperature:  { l2: 5.0,  l3: 10.0 }   # degC above the limit
  coolant temperature:        { l2: 5.0,  l3: 10.0 }   # degC above the limit
  exhaust gas temperature:    { l2: 25.0, l3: 50.0 }   # degC above the limit
  oil temperature:            { l2: 5.0,  l3: 10.0 }   # degC above the limit
  oil pressure:               { l2: 3.0,  l3: 6.0 }    # psi below the minimum
