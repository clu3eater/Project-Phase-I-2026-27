<!doctype html>
<html lang="en" data-ambient="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The State Emblem, which the console already carries in its masthead.
         Without a link element the browser asks for /favicon.ico on every load
         and takes a 404 -- the only console error left in the capture, and a
         needless one on a system whose provenance is part of the point. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Engine Digital Twin — GCS Console</title>
  </head>
  <!-- DAY is the default ambient state.

       Set here rather than in React so the attribute is on the root element
       before the first paint. Setting it in a useEffect leaves one frame
       rendered against the night palette, and a console that flashes dark on
       every load looks broken on a lit flight line -- which is where it is
       switched on. MIL-STD-411F 5.2.3 wants legibility up to 10,000 fc through
       the windows, and that is the condition to default to; the operator can
       still choose NIGHT from the header. -->
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
