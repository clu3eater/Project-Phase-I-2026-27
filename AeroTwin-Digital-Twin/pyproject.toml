[project]
name = "dt-uav-engine"
version = "0.1.0"
description = "AI-Enabled Real-Time Digital Twin for Aero Piston Engines in MALE UAVs (DRDO PS-26054)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    # Everything here is either imported directly by the source tree or is a
    # runtime engine another dependency needs. Nothing is declared for work
    # that has not been written -- see scripts/licence_audit.py, which fails
    # the build on an import that is not declared.
    #
    # --- core numerics -------------------------------------------------
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=15.0",          # parquet engine pandas needs; not imported directly
    # --- config / schema -----------------------------------------------
    "pyyaml>=6.0",
    "pydantic>=2.6",
    # --- layer 1: CAN ---------------------------------------------------
    # python-can is LGPL-3.0-only, the one non-permissive licence in the
    # closure. Weak copyleft: it is imported as a separable library and can be
    # replaced by the recipient, which satisfies the LGPL. Recorded here
    # because it is a distribution constraint on a delivered system and must
    # not be discovered at handover. See docs/INDIGENISATION.md.
    "python-can>=4.3",
    "cantools>=39.4",
    # The AIRCRAFT-to-ground transport. Not a replacement for the console's
    # WebSocket, which is the GROUND-to-browser hop: this is the lossy,
    # intermittent link, and the reason for it is the Last Will and Testament.
    # The broker announces a lost airframe instead of the ground station
    # inferring it from a timeout -- see DEV-161 and layer1_edge/mqtt_link.py.
    # EPL/EDL licensed, so it does not disturb the closure INDIGENISATION audits.
    "paho-mqtt>=2.0",
    # --- layer 3: classical ML -----------------------------------------
    # PINNED EXACTLY, because the trained models are pickles. The Tier-2
    # ensemble (isolation forest + CBLOF) and the survival head's calibrator
    # were saved with 1.7.2, and scikit-learn supports unpickling ONLY in the
    # version that pickled: under 1.9.0 every start warned "might lead to
    # breaking code or invalid results". Under 1.7.2 the shipped survival head
    # reproduces its recorded held-out AUC and Brier skill to three decimals.
    # Moving this pin means refitting (scripts/eval_tier2.py,
    # scripts/train_survival.py) in the new version, in the same commit.
    "scikit-learn==1.7.2",
    # The survival head's booster. Chosen on a measured comparison against
    # scikit-learn's HistGradientBoosting and LightGBM on THIS data, not on
    # reputation -- see the table in layer3_ai/rul_survival.py. Apache-2.0, so
    # it does not disturb the closure docs/INDIGENISATION.md audits. sklearn
    # stays the automatic fallback where catboost is absent.
    "catboost>=1.2,<1.3",
    # --- layer 4: API ---------------------------------------------------
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",       # WS /ws/state transport; pulled via uvicorn too
]

[project.optional-dependencies]
# Deep learning. Split out so the core system installs fast and the edge image
# stays small (edge only needs onnxruntime).
ml = [
    "torch>=2.2",
]
# Edge deployment: export the trained networks and run them without torch.
edge = [
    "onnx>=1.16",
    "onnxruntime>=1.17",
]
# Physics: Cantera is optional by decision D7 (a precomputed lookup ships in-repo).
physics = ["cantera>=3.0"]
# PDF post-flight report export.
reports = ["reportlab>=4.1"]
# Central fleet server (fleet_server/). asyncpg rather than psycopg:
# Apache-2.0 rather than LGPL, and async-native, which matters for a
# dependency closure that docs/INDIGENISATION.md audits as a whole.
fleet = ["asyncpg>=0.29"]
# Authentication for the twin API. Not yet written; the extra exists so the
# dependency is declared where it is used rather than in the core install.
security = [
    "pyjwt[crypto]>=2.8",
    # bcrypt and cryptography are imported DIRECTLY by layer4_core/security.py,
    # so they are declared directly. Relying on passlib[bcrypt] to drag bcrypt
    # in made them transitive dependencies of code that imports them by name --
    # which scripts/licence_audit.py correctly flags, because a transitive
    # dependency can vanish when the intermediary changes its own requirements.
    "bcrypt>=4.1",
    "cryptography>=42.0",
]
# Builds the SIH idea presentation (gen_ppt.py).
docs = ["python-pptx>=0.6.23"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",            # fastapi.testclient
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
    "psutil>=5.9",        # scripts/edge_footprint.py
    "pypdf>=4.0",         # layer4_core/tests/test_report_pdf.py
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "fleet_server",
    "layer1_edge",
    "layer2_physics",
    "layer3_ai",
    "layer3_ai.fed",
    "layer4_core",
    "layer5_viz",
    "common",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = [
    "E741",  # ambiguous names: physics uses l, I, O as symbols
    "N803",  # argument names: physics uses T, P, N_e
    "N806",  # variable names in function scope: same reason
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests", "layer1_edge/tests", "layer2_physics/tests", "layer3_ai/tests", "layer4_core/tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    # The live-pipeline tests run the real loop for a few seconds each.
    # They are the only tests that exercise all five layers together, which
    # is why the console freeze (DEV-149) reached an operator: every cheap
    # unit test passed. Deselect with -m "not slow" if you must.
    "slow: runs the real live pipeline; seconds, not milliseconds",
]
